version: v0.4
project:
  name: Pointwise Ergodic Theorems Along $\lfloor p^c\rfloor$ for Every $c>1$
  description: >-
    Lean 4 formalization of the variational estimate, common pointwise limit
    for von Mangoldt and prime averages, and logarithmic Mobius cancellation
    in Pointwise Ergodic Theorems Along $\lfloor p^c\rfloor$ for Every $c>1$. The author selected
    the a.e.-only conclusion for the submitted prime-convergence statement.
    All results are stated for sigma-finite measure-preserving systems.
  authors:
  - Anastasios Fragkos
  responsible_maintainers:
  - Anastasios Fragkos
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: Pointwise Ergodic Theorems Along $\lfloor p^c\rfloor$ for Every $c>1$
  authors:
  - Anastasios Fragkos
  type: paper
  location: Theorem t:maintheorem, Corollary cor:prime-convergence, Theorem t:mobius-convergence
  relationship: formalizes
  note: 'Author-supplied authoritative final manuscript; repository TeX copies have normalized indentation: source-paper/fractionalpowersofprimesfinal.tex;
    accompanying bibliography source-paper/fractionalprimesbib.bib.'
  author_endorsement: participated
