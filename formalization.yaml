review:
  status: self-assessed
  reviewers: []
  notes: >-
    The complete a.e.-only Ubuntu Comparator log and transferred reports were
    inspected. All 3933 Lean-source hashes and recorded configuration hashes
    match the locally checked source package. All three configured kernels
    accepted; the author reported immediate pipeline exit status zero.
    See verification-report.md and audits/linux_comparator.json.
    Registry/editorial review remains external.
fidelity:
  divergences: >-
    Complex observables are explicit. Positive averaging scales start at N=1,
    and prime normalization starts at N=2. The enumerated-prime averages have
    the same almost-everywhere limit. At the author's explicit request, the
    submitted corollary records only its pointwise conclusion. The unchanged
    supplied paper also states norm convergence. Norm arguments remain as
    supporting proof infrastructure. The Mobius assertion is the stated
    logarithmic almost-everywhere decay rate.
